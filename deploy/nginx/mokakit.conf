# ============================================================
# MokaKit 摩卡工具箱 —— 正式站点配置（备案通过后启用）
#
# 放置路径：/etc/nginx/conf.d/mokakit.conf
# 生效命令：nginx -t && systemctl reload nginx
#
# 这份配置只占用 80/443。OpenClaw 网关走的是 127.0.0.1:18789，
# 两者端口不冲突，可以在同一台机器上长期并存。
# ============================================================

# ---------- 1. 主站 mokakit.com ----------
server {
    listen      80;
    listen      [::]:80;
    server_name mokakit.com;

    # 【备案通过 + 申请到 SSL 证书后】取消下面这行注释，把 HTTP 全量跳 HTTPS，
    # 并启用文件末尾的 443 server 块。
    return 301 https://www.mokakit.com$request_uri;

    root  /var/www/mokakit;
    index index.html;
    charset utf-8;

    # 站点是 trailingSlash: always，Nginx 给目录自动补斜杠时用相对跳转，
    # 否则 Location 头会暴露服务器内网 IP 和端口。
    absolute_redirect off;

    access_log /var/log/nginx/mokakit.access.log;
    error_log  /var/log/nginx/mokakit.error.log warn;

    # 静态站体积很小，实时 gzip 的 CPU 开销可以忽略
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml application/javascript
                    application/json application/xml image/svg+xml
                    application/rss+xml font/woff2;

    # Astro 产物文件名自带内容 hash，可以永久缓存
    location /_astro/ {
        include /etc/nginx/snippets/mokakit-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location = /favicon.svg {
        include /etc/nginx/snippets/mokakit-headers.conf;
        expires 7d;
        access_log off;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/mokakit-headers.conf;
        expires 1h;
    }

    location ~* ^/sitemap.*\.xml$ {
        include /etc/nginx/snippets/mokakit-headers.conf;
        expires 1h;
    }

    # 匿名计数接口：反代到本机计数服务（仅 127.0.0.1 监听，不暴露公网）。
    # 不进访问日志、不写缓存、限小 body。
    location /api/ {
        include /etc/nginx/snippets/mokakit-headers.conf;
        add_header Cache-Control "no-store" always;
        client_max_body_size 8k;
        access_log off;
        proxy_pass http://127.0.0.1:18800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML 不做长缓存：改了内容要能立刻生效，也方便搜索引擎重新抓取
    location / {
        include /etc/nginx/snippets/mokakit-headers.conf;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/mokakit-headers.conf;
        internal;
    }

    # 隐藏文件一律拒绝（.git / .env 之类误传上来也不会泄露）
    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ---------- 2. mokakit.com 与 .cn 备用域名，整站 301 到 www 主域 ----------
# 两个域名出一模一样的内容会被判重复内容、互相抢排名，
# 所以备用域名只做跳转，不出内容、不进 sitemap。
server {
    listen      80;
    listen      [::]:80;
    server_name www.mokakit.com mokakit.cn www.mokakit.cn;

    # 上 HTTPS 后把这里的 http:// 改成 https://
        return 301 https://www.mokakit.com$request_uri;
}

# ---------- 3. 兜底：裸 IP 或未知域名访问一律断开 ----------
# 备案期间管局会扫描服务器 IP，裸 IP 不能返回任何网站内容。
# 长期保留这段也能挡掉大量扫描器和恶意绑定域名。
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return 444;
}

# ============================================================
# ---------- 4. HTTPS（备案通过 + 免费证书就位后再启用）----------
#
# 免费证书二选一（都免费）：
#   ① 推荐 Let's Encrypt（acme.sh 申请，90 天自动续期）：
#      在服务器上执行：bash server-setup.sh --cert
#   ② 腾讯云控制台申请的免费 DV 证书：
#      下载 Nginx 格式（mokakit.com_bundle.crt + mokakit.com.key），
#      改名放到 /etc/nginx/ssl/mokakit.com/fullchain.cer 和 mokakit.com.key
#
# 启用 HTTPS 三步（或直接执行 bash server-setup.sh --enable-ssl）：
#   1) 主站 80 server 里取消「return 301 https://mokakit.com$request_uri;」的注释
#   2) 取消下面这行 include 的注释
#   3) nginx -t && systemctl reload nginx
#
# 443 的具体配置在 mokakit-ssl.conf，证书路径统一为：
#   /etc/nginx/ssl/mokakit.com/fullchain.cer
#   /etc/nginx/ssl/mokakit.com/mokakit.com.key
# ============================================================

include /etc/nginx/mokakit-ssl.conf;

# ============================================================
# ---------- 5. OpenClaw 控制台反代（默认不启用，强烈建议保持关闭）----------
#
# OpenClaw 能执行 shell 命令、读写文件系统。把它的控制台暴露到公网，
# 等于把服务器的 root 权限挂到互联网上，风险极高。
# 日常访问请走 SSH 隧道，在你自己电脑上执行：
#
#     ssh -N -L 18789:127.0.0.1:18789 root@你的服务器IP
#
# 然后本机浏览器打开 http://127.0.0.1:18789 即可，全程加密、不暴露端口。
#
# 如果你确实需要公网访问，至少要套 HTTPS + Basic Auth，并且用独立子域名
# （该子域名同样需要完成备案）：
#
# server {
#     listen      443 ssl;
#     server_name claw.mokakit.com;
#     ssl_certificate     /etc/nginx/ssl/mokakit.com_bundle.crt;
#     ssl_certificate_key /etc/nginx/ssl/mokakit.com.key;
#
#     auth_basic           "restricted";
#     auth_basic_user_file /etc/nginx/.htpasswd;   # htpasswd -c /etc/nginx/.htpasswd 用户名
#
#     location / {
#         proxy_pass http://127.0.0.1:18789;
#         proxy_http_version 1.1;
#         proxy_set_header Upgrade    $http_upgrade;   # OpenClaw 走 WebSocket，这两行必需
#         proxy_set_header Connection "upgrade";
#         proxy_set_header Host       $host;
#         proxy_set_header X-Real-IP  $remote_addr;
#         proxy_read_timeout 3600s;
#     }
# }
# ============================================================
