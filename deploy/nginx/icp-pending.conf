# ============================================================
# 备案审核期专用配置 —— 域名已解析、但网站还不能对外提供内容
#
# 放置路径：/etc/nginx/conf.d/mokakit.conf（先用这份，备案通过后再换成正式版）
#
# 为什么需要这一步：
# 提交备案后，管局会实际访问你的域名和服务器 IP 做核验。这个阶段如果
# 网站已经能正常打开完整内容，会被判定为「未备案先上线」，轻则退回重来、
# 重则拉黑主体。所以备案期间只回一个静态占位页，什么内容都不放。
# ============================================================

server {
    listen      80;
    listen      [::]:80;
    server_name mokakit.com www.mokakit.com mokakit.cn www.mokakit.cn;

    root  /var/www/icp-pending;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    access_log /var/log/nginx/icp-pending.access.log;

    # 任何路径都回占位页，不暴露站点任何真实内容
    location / {
        try_files /index.html =503;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# 裸 IP 或未知域名一律断开连接
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;
    return 444;
}
