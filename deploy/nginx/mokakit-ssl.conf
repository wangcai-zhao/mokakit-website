# ============================================================
# MokaKit HTTPS 配置（由 mokakit.conf 通过 include 引入）
#
# 证书路径（Let's Encrypt acme.sh / 腾讯云免费 DV 证书通用）：
#   /etc/nginx/ssl/mokakit.com/fullchain.cer
#   /etc/nginx/ssl/mokakit.com/mokakit.com.key
#
# 该文件默认不生效，需在 mokakit.conf 里取消对应 include 注释，
# 或执行：bash server-setup.sh --enable-ssl
# ============================================================

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name mokakit.com;

    ssl_certificate     /etc/nginx/ssl/mokakit.com/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/mokakit.com/mokakit.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # 该 Let's Encrypt 证书（YE2 链）无 OCSP 响应器 URL，stapling 不可用，关闭以消除告警
    ssl_stapling        off;
    ssl_stapling_verify off;

    root  /var/www/mokakit;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    access_log /var/log/nginx/mokakit.ssl.access.log;
    error_log  /var/log/nginx/mokakit.ssl.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json application/xml image/svg+xml font/woff2;

    location /_astro/ {
        include /etc/nginx/snippets/mokakit-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location = /favicon.svg {
        include /etc/nginx/snippets/mokakit-headers.conf;
        expires 7d;
        access_log off;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/mokakit-headers.conf;
        expires 1h;
    }

    location ~* ^/sitemap.*\.xml$ {
        include /etc/nginx/snippets/mokakit-headers.conf;
        expires 1h;
    }

    # 匿名计数接口（HTTPS 版）：反代到本机计数服务
    location /api/ {
        include /etc/nginx/snippets/mokakit-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 8k;
        access_log off;
        proxy_pass http://127.0.0.1:18800;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        include /etc/nginx/snippets/mokakit-headers.conf;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/mokakit-headers.conf;
        internal;
    }

    location ~ /\.(?!well-known) { deny all; }
}

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.mokakit.com mokakit.cn www.mokakit.cn;
    ssl_certificate     /etc/nginx/ssl/mokakit.com/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/mokakit.com/mokakit.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://mokakit.com$request_uri;
}
