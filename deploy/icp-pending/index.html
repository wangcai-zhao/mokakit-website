<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>网站建设中</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf7f2;
        color: #3b2a1d;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        line-height: 1.7;
      }
      .card {
        width: 100%;
        max-width: 440px;
        text-align: center;
        background: #fff;
        border: 1px solid #e8ded1;
        border-radius: 16px;
        padding: 48px 32px;
      }
      .logo {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: #6f4a2e;
        color: #fff;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #7a6555;
      }
      .hint {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #f0e8dd;
        font-size: 13px;
        color: #a08b78;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M10 2v2" />
          <path d="M14 2v2" />
          <path
            d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"
          />
          <path d="M6 2v2" />
        </svg>
      </div>
      <h1>网站建设中</h1>
      <p>本站正在进行 ICP 备案，审核通过后即可正常访问。</p>
      <div class="hint">感谢你的耐心等待</div>
    </div>
  </body>
</html>
